<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Basta Online</title><link rel="stylesheet" href="style.css"></head><body><main class="shell"><header><h1>🎮 Basta Online</h1><span id="status">Conectando...</span></header><section id="entry" class="panel"><h2>¡A jugar!</h2><label>Tu apodo<input id="nick" maxlength="20" placeholder="Ej. Alex"></label><div class="actions"><button id="create">Crear sala</button><button id="join">Unirme a sala</button></div><label>Código de sala<input id="code" maxlength="6" placeholder="ABC123"></label><p class="hint">Comparte el enlace de la sala. El anfitrión puede iniciar cuando quiera.</p></section><section id="room" class="panel hidden"><div class="roomhead"><div><p class="eyebrow">SALA <strong id="roomCode"></strong></p><h2 id="phase">Sala de espera</h2></div><button id="copy" class="secondary">Copiar invitación</button></div><p id="notice" class="hint"></p><div class="layout"><div><div id="round" class="hidden"><div class="roundbar"><div>LETRA <strong id="letter">—</strong></div><div>TIEMPO <strong id="timer">01:30</strong></div></div><form id="answers"><div id="fields"></div><button id="basta" type="button" class="danger">¡BASTA!</button></form></div><div id="results" class="hidden"><h3>Respuestas de la ronda</h3><div id="review"></div></div><button id="start" class="hidden">Iniciar ronda</button></div><aside><h3>Jugadores <span id="count"></span></h3><ul id="players"></ul><h3>Clasificación</h3><ol id="ranking"></ol></aside></div></section><footer>Juego de prueba. No introduzcas información personal o empresarial.</footer></main><script type="module" src="script.js"></script></body></html>
