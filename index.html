<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Basta Online - Prueba Firebase</title>
<style>body{font-family:system-ui,Arial,sans-serif;background:#f4f6fb;margin:0;padding:30px;color:#172033}.panel{max-width:620px;margin:40px auto;background:white;border-radius:18px;padding:28px;box-shadow:0 8px 30px #17203318}h1{margin-top:0}input{padding:12px;border:1px solid #bbb;border-radius:8px;flex:1;min-width:0}button{background:#295bd7;color:white;border:0;border-radius:8px;padding:12px 18px;cursor:pointer}.line{display:flex;gap:8px}#messages{list-style:none;padding:0;max-height:350px;overflow:auto}li{background:#eef2fa;padding:10px;border-radius:8px;margin:8px 0;overflow-wrap:anywhere}.muted{color:#5c6475;font-size:14px}</style></head>
<body><main class="panel"><h1>🎮 Basta Online</h1><p>Prueba de sincronización con Firebase</p><p id="status" role="status">Conectando...</p><form id="form" class="line"><input id="message" maxlength="120" placeholder="Escribe un mensaje de prueba" required><button id="send" disabled>Enviar</button></form><h2>Mensajes</h2><ul id="messages"></ul><p class="muted">Prueba temporal: no introduzcas información personal o de la empresa.</p></main>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js';
import { getAuth, signInAnonymously } from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js';
import { getDatabase, ref, push, onValue } from 'https://www.gstatic.com/firebasejs/12.4.0/firebase-database.js';
const firebaseConfig = {apiKey:'AIzaSyDABuIksWqVCliq1y6Ii76oj_rLRC8BOGc',authDomain:'basta-online-dc8d6.firebaseapp.com',databaseURL:'https://basta-online-dc8d6-default-rtdb.firebaseio.com',projectId:'basta-online-dc8d6',storageBucket:'basta-online-dc8d6.firebasestorage.app',messagingSenderId:'2749637638',appId:'1:2749637638:web:ae09e926c7ddf71adb0f87'};
const status=document.getElementById('status'), send=document.getElementById('send'), form=document.getElementById('form'), input=document.getElementById('message'), messages=document.getElementById('messages');
const app=initializeApp(firebaseConfig); const auth=getAuth(app); const db=getDatabase(app); const listRef=ref(db,'pruebaBasta/mensajes');
try { await signInAnonymously(auth); status.textContent='Autenticado. Esperando datos...'; onValue(listRef, snapshot=>{messages.replaceChildren();const data=snapshot.val()||{};Object.values(data).slice(-30).forEach(item=>{const li=document.createElement('li');li.textContent=typeof item.texto==='string'?item.texto:'(mensaje inválido)';messages.append(li)});status.textContent='Conectado: los mensajes se sincronizan en tiempo real';send.disabled=false;}, error=>{status.textContent='Error al leer: '+error.message;send.disabled=true});} catch(error){status.textContent='Error de autenticación: '+error.message;}
form.addEventListener('submit',async e=>{e.preventDefault();const texto=input.value.trim();if(!texto)return;send.disabled=true;try{await push(listRef,{texto});input.value='';}catch(error){status.textContent='Error al enviar: '+error.message;}finally{send.disabled=false;}});
</script></body></html>
